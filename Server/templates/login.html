<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.FROG // Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #00ff41;
            --border: #1f2937;
            --text: #e6edf3;
            --text-dim: #7d8590;
            --danger: #ff3e3e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .login-box { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border); padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .header h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; color: var(--accent); text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 14px; outline: none; width: 100%; }
        button { background: var(--accent); color: var(--bg); border: none; padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; width: 100%; }
        .error { background: rgba(255, 62, 62, 0.1); border-left: 3px solid var(--danger); color: var(--danger); padding: 10px; font-size: 11px; font-family: monospace; }
        .footer { text-align: center; font-size: 9px; color: var(--text-dim); font-family: monospace; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="header"><h1>S.FROG // AUTH</h1></div>
        {% if error %}<div class="error">[ERR] {{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group"><input type="password" name="password" placeholder="MASTER_KEY" required autofocus></div>
            <button type="submit">EXECUTE_LOGIN</button>
        </form>
        <div class="footer">V.1.0.4 // INDUSTRIAL_INTEL</div>
    </div>
</body>
</html>
