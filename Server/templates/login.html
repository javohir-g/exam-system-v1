<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SCREEN FROG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-radial: radial-gradient(circle at top center, #0f172a, #020617);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.04);
            --text-main: #f8fafc;
            --text-dim: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --card-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-radial);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── LOGIN CARD ── */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 48px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            animation: card-appear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes card-appear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-box h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── FORM ── */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 14px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #fff;
            color: var(--bg-deep);
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 8px 16px var(--accent-glow);
        }

        .error-msg {
            margin-top: 20px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            color: var(--danger);
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
        }

        /* ── DECORATION ── */
        .corner-accent {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="corner-accent"></div>
        
        <div class="logo-box">
            <h1>SCREEN FROG</h1>
            <div class="status-pill">● Authentication Required</div>
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="password">Encrypted Access</label>
                <div class="input-wrapper">
                    <input type="password" name="password" id="password" placeholder="••••••••••••" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn-submit">Enter Pipeline</button>
        </form>

        {% if error %}
        <div class="error-msg">
            ACCESS_DENIED: Invalid Credentials
        </div>
        {% endif %}
    </div>

</body>
</html>
