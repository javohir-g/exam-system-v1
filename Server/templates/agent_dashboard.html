<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.FROG // Fleet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #00ff41;
            --accent-dim: rgba(0, 255, 65, 0.15);
            --border: #1f2937;
            --text: #e6edf3;
            --text-dim: #7d8590;
            --danger: #ff3e3e;
            --sidebar-w: 220px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 13px; min-height: 100vh; display: flex; }

        .sidebar { width: var(--sidebar-w); border-right: 1px solid var(--border); height: 100vh; position: fixed; display: flex; flex-direction: column; background: var(--bg); z-index: 1000; transition: transform 0.3s; }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 1.1rem; }
        .sidebar-nav { flex: 1; padding: 10px 0; }
        .nav-item { display: flex; padding: 12px 20px; color: var(--text-dim); text-decoration: none; text-transform: uppercase; font-size: 11px; border-left: 2px solid transparent; }
        .nav-item.active { color: var(--accent); background: var(--accent-dim); border-left-color: var(--accent); }
        .logout-item { margin-top: auto; border-top: 1px solid var(--border); color: var(--danger); }

        .sidebar-toggle { display: none; background: var(--panel); border: 1px solid var(--border); color: var(--accent); padding: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; cursor: pointer; position: fixed; top: 12px; left: 12px; z-index: 1100; }
        .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 900; }

        .main-content { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-width: 0; }
        .top-bar { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
        .page-title h2 { font-family: 'JetBrains Mono', monospace; font-size: 1rem; text-transform: uppercase; }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; cursor: pointer; }
        .btn-active { border-color: var(--accent); color: var(--bg); background: var(--accent); }

        .filter-bar { padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; gap: 12px; flex-wrap: wrap; }
        .search-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; flex: 1; min-width: 150px; outline: none; }
        .filter-select { background: var(--bg); border: 1px solid var(--border); color: var(--text-dim); padding: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; outline: none; }

        .stats-row { display: flex; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
        .stat-box { padding: 12px 24px; border-right: 1px solid var(--border); flex: 1; min-width: 120px; }
        .stat-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 800; }

        .fleet-container { flex: 1; overflow: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: var(--bg); text-align: left; padding: 10px 16px; font-size: 9px; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
        td { padding: 10px 16px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .agent-id { color: var(--accent); font-weight: 800; }
        .status-cell { display: flex; align-items: center; gap: 8px; }
        .indicator { width: 6px; height: 6px; background: #334155; }
        .ind-online { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-toggle { display: block; }
            .mobile-overlay.active { display: block; }
            .main-content { margin-left: 0; padding-top: 50px; }
            .top-bar { padding: 12px; padding-left: 60px; flex-direction: column; align-items: flex-start; gap: 12px; }
            .header-actions { width: 100%; justify-content: space-between; }
            .stat-box { border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>
<button class="sidebar-toggle" onclick="toggleSidebar()">MENU</button>
<div class="mobile-overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">S.FROG // FLEET</div>
    <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item">Monitor</a>
        <a href="/agents" class="nav-item active">Fleet_Mgmt</a>
        <a href="/hardware" class="nav-item">Hardware_Ctrl</a>
        <a href="#" class="nav-item">Global_Logs</a>
        <a href="/logout" class="nav-item logout-item">Terminate_Session</a>
    </nav>
</aside>

<main class="main-content">
    <header class="top-bar">
        <div class="page-title"><h2>Registry / Fleet</h2></div>
        <div class="header-actions">
            <button id="agent-toggle" onclick="toggleAgentSystem()" class="btn {{ 'btn-active' if global_agent_enabled else '' }}">
                AI: {{ 'ON' if global_agent_enabled else 'OFF' }}
            </button>
            <a href="/download/installer" class="btn">Installer</a>
            <button class="btn" onclick="location.reload()">Sync</button>
        </div>
    </header>

    <div class="filter-bar">
        <input type="text" id="agent-search" class="search-input" placeholder="SEARCH..." oninput="filterFleet()">
        <select id="status-filter" class="filter-select" onchange="filterFleet()">
            <option value="all">ALL</option>
            <option value="online">LIVE</option>
            <option value="offline">LOST</option>
        </select>
    </div>

    <div class="stats-row">
        <div class="stat-box"><span class="stat-label">Total</span><div class="stat-value">{{ fleet|length }}</div></div>
        <div class="stat-box"><span class="stat-label">Live</span><div class="stat-value" id="online-count">0</div></div>
    </div>

    <div class="fleet-container">
        <table>
            <thead>
                <tr>
                    <th>Identity</th>
                    <th>User</th>
                    <th>Signal</th>
                    <th>Last_Sync</th>
                </tr>
            </thead>
            <tbody id="fleet-body">
                {% for nid, f in fleet.items() %}
                <tr class="fleet-row" data-host="{{ f.hostname }}" data-user="{{ f.username }}" data-seen="{{ f.last_seen }}">
                    <td><span class="agent-id">{{ f.hostname }}</span></td>
                    <td>{{ f.username }}</td>
                    <td>
                        <div class="status-cell">
                            <div class="indicator"></div>
                            <span class="status-label">---</span>
                        </div>
                    </td>
                    <td style="color: var(--text-dim)">{{ f.last_seen }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</main>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    }
    function updateStatus() {
        const now = new Date();
        let online = 0;
        document.querySelectorAll('.fleet-row').forEach(row => {
            const lastSeenStr = row.dataset.seen;
            if (!lastSeenStr) return;
            const lastSeen = new Date(lastSeenStr.replace(' ', 'T'));
            const diff = (now - lastSeen) / 1000;
            const ind = row.querySelector('.indicator');
            const lbl = row.querySelector('.status-label');
            const isOnline = diff < 120;
            row.dataset.online = isOnline ? "true" : "false";
            if (isOnline) { ind.className = 'indicator ind-online'; lbl.textContent = 'LIVE'; lbl.style.color = 'var(--accent)'; online++; }
            else { ind.className = 'indicator'; lbl.textContent = 'LOST'; lbl.style.color = 'var(--text-dim)'; }
        });
        document.getElementById('online-count').textContent = online;
        filterFleet();
    }
    function filterFleet() {
        const q = document.getElementById('agent-search').value.toLowerCase();
        const s = document.getElementById('status-filter').value;
        document.querySelectorAll('.fleet-row').forEach(row => {
            const h = row.dataset.host.toLowerCase();
            const u = row.dataset.user.toLowerCase();
            const isOn = row.dataset.online === "true";
            const mQ = h.includes(q) || u.includes(q);
            const mS = s === "all" || (s === "online" && isOn) || (s === "offline" && !isOn);
            row.style.display = (mQ && mS) ? "" : "none";
        });
    }
    function toggleAgentSystem() {
        fetch('/toggle_agent_system', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
        .then(r => r.json()).then(() => window.location.reload());
    }
    updateStatus();
    setInterval(updateStatus, 10000);
</script>
</body>
</html>
